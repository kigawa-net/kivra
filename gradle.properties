org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# Kotlin/Wasm のコンパイルは Kotlin daemon で行う。未指定だと daemon は JVM 既定(物理メモリの 1/4 ≒ 4g)で動き、
# compose-ui の wasm を続けてコンパイルすると "Not enough memory to run compilation" で落ちる(CI の test-h2)。
# 公開リポジトリの標準 runner は 16 GB: Gradle 2g + Kotlin daemon 6g + テスト JVM(1g x 2)で収まる見込み。
kotlin.daemon.jvmargs=-Xmx6g
org.gradle.parallel=true
kotlin.code.style=official
org.gradle.workers.max=4
