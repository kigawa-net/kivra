ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.kivra.ApplicationKt.module ]
    }
}

kivra {
    database {
        # Timestamps are UTC: keep the MariaDB session in UTC (see README).
        jdbcUrl = "jdbc:mariadb://localhost:3306/kivra?sessionVariables=time_zone='+00:00'"
        jdbcUrl = ${?KIVRA_DB_JDBC_URL}
        user = "kivra"
        user = ${?KIVRA_DB_USER}
        password = "change-this-in-production"
        password = ${?KIVRA_DB_PASSWORD}
        # Optional. Set both or neither: Flyway (DDL) uses these; the application pool keeps user/password (DML only).
        migrationUser = ""
        migrationUser = ${?KIVRA_DB_MIGRATION_USER}
        migrationPassword = ""
        migrationPassword = ${?KIVRA_DB_MIGRATION_PASSWORD}
    }
    lease {
        ttlSeconds = 30
        ttlSeconds = ${?KIVRA_LEASE_TTL_SECONDS}
        graceSeconds = 5
        graceSeconds = ${?KIVRA_LEASE_GRACE_SECONDS}
    }
    budget {
        # Monthly external API cap (JPY, JST calendar month). Hard limit is fixed here; there is no runtime API to raise it.
        tenantId = "default"
        tenantId = ${?KIVRA_BUDGET_TENANT_ID}
        monthlyLimitJpy = "10000"
        monthlyLimitJpy = ${?KIVRA_BUDGET_MONTHLY_LIMIT_JPY}
        softRatio = "0.8"
        softRatio = ${?KIVRA_BUDGET_SOFT_RATIO}
    }
    metrics {
        # /metrics is disabled by default. Enabling it requires bearerToken (startup fails otherwise).
        enabled = false
        enabled = ${?KIVRA_METRICS_ENABLED}
        bearerToken = ""
        bearerToken = ${?KIVRA_METRICS_BEARER_TOKEN}
    }
}

# fusha-task adapter (read-only, M1 #27). All values need confirmation per environment (design #2 section 13).
kivra.fusha {
    baseUrl = "http://localhost:8787/api/v1"
    baseUrl = ${?KIVRA_FUSHA_BASE_URL}
    # Used in TaskId (fusha:{env}:{id}).
    environment = "dev"
    environment = ${?KIVRA_FUSHA_ENV}
    # Static bearer token (Keycloak ID token). Empty = unset. Auth method is unconfirmed: client_credentials may not pass aud check.
    token = ""
    token = ${?KIVRA_FUSHA_TOKEN}
    requestTimeoutMillis = 10000
    requestTimeoutMillis = ${?KIVRA_FUSHA_REQUEST_TIMEOUT_MS}
    connectTimeoutMillis = 5000
    maxRetries = 3
    maxRetries = ${?KIVRA_FUSHA_MAX_RETRIES}
    initialBackoffMillis = 200
    maxBackoffMillis = 5000
}

# Poller (read-only, issue #28). Poll scope must be restricted by viewId or assigneeId.
kivra.fusha.poller {
    viewId = ""
    viewId = ${?KIVRA_FUSHA_VIEW_ID}
    assigneeId = ""
    assigneeId = ${?KIVRA_FUSHA_ASSIGNEE_ID}
    intervalMillis = 30000
    intervalMillis = ${?KIVRA_FUSHA_POLL_INTERVAL_MS}
    jitterMillis = 5000
    fullRescanEveryPolls = 20
    breakerFailureThreshold = 3
    breakerCooldownMillis = 60000
}

# StatusMapping (issue #28). Writes stay OFF until the status customField key and options are confirmed (design #2 section 13-1).
kivra.fusha.statusMapping {
    writeEnabled = false
    writeEnabled = ${?KIVRA_FUSHA_STATUS_WRITE_ENABLED}
    statusFieldKey = ""
    kivraToFusha {}
}
