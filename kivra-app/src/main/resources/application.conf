ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.kivra.ApplicationKt.module ]
    }
}

kivra {
    database {
        # Timestamps are UTC: keep the MariaDB session in UTC (see README).
        jdbcUrl = "jdbc:mariadb://localhost:3306/kivra?sessionVariables=time_zone='+00:00'"
        jdbcUrl = ${?KIVRA_DB_JDBC_URL}
        user = "kivra"
        user = ${?KIVRA_DB_USER}
        password = "change-this-in-production"
        password = ${?KIVRA_DB_PASSWORD}
    }
    lease {
        ttlSeconds = 30
        ttlSeconds = ${?KIVRA_LEASE_TTL_SECONDS}
        graceSeconds = 5
        graceSeconds = ${?KIVRA_LEASE_GRACE_SECONDS}
    }
}

# fusha-task adapter (read-only, M1 #27). All values need confirmation per environment (design #2 section 13).
kivra.fusha {
    baseUrl = "http://localhost:8787/api/v1"
    baseUrl = ${?KIVRA_FUSHA_BASE_URL}
    # Used in TaskId (fusha:{env}:{id}).
    environment = "dev"
    environment = ${?KIVRA_FUSHA_ENV}
    # Static bearer token (Keycloak ID token). Empty = unset. Auth method is unconfirmed: client_credentials may not pass aud check.
    token = ""
    token = ${?KIVRA_FUSHA_TOKEN}
    requestTimeoutMillis = 10000
    requestTimeoutMillis = ${?KIVRA_FUSHA_REQUEST_TIMEOUT_MS}
    connectTimeoutMillis = 5000
    maxRetries = 3
    maxRetries = ${?KIVRA_FUSHA_MAX_RETRIES}
    initialBackoffMillis = 200
    maxBackoffMillis = 5000
}
