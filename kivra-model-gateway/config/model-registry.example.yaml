# Model Registry (Git-managed source of truth, design 05 section 5). Changes go through PR.
# NOTE: prices, context sizes and dataHandling below are PLACEHOLDERS. Confirm them against the
# provider's primary sources before use (design 05 section 16-6). While dataHandling.status is UNKNOWN
# the provider is not used for INTERNAL or more sensitive data. No secrets belong here: credentialRef
# is only a logical label: the secret's env var and the allowed endpoint host are fixed by the trusted
# administrator's CredentialBinding (not in this file), and endpoint must be https.
registryVersion: "2026-10-12-example"

providers:
  - id: anthropic
    adapter: anthropic
    trustZone: EXTERNAL
    dataHandling:
      status: UNKNOWN          # set to CONFIRMED with confirmedBy / confirmedAt / sourceUrl once verified
    enabled: true
    endpoint: https://api.anthropic.com
    credentialRef: ANTHROPIC_API_KEY
  # On-premises OpenAI-compatible server (vLLM / Ollama / llama.cpp) inside the cluster. PLACEHOLDER values: the real endpoint host
  # comes from the deployment (KIVRA_SELFDEV_LOCAL_LLM_HOST, a trusted binding); only LOCAL may use http. No credential is used,
  # so credentialRef is the fixed label "none". dataHandling stays UNKNOWN until the operator confirms where the data lives.
  - id: local-llm
    adapter: openai
    trustZone: LOCAL
    dataHandling:
      status: UNKNOWN
    enabled: true
    endpoint: http://llm.example.internal:8000   # placeholder: cluster-internal host and port
    credentialRef: none

models:
  - id: claude-sonnet
    providerId: anthropic
    providerModelName: claude-sonnet-5-5   # configuration value; not hard-coded in code
    lifecycle: ACTIVE
    capabilities: [TEXT, VISION_INPUT, TOOL_CALLING, STRUCTURED_OUTPUT_NATIVE, STREAMING, SYSTEM_PROMPT, LONG_CONTEXT, PROMPT_CACHING]
    contextWindowTokens: 200000   # placeholder: verify
    maxOutputTokens: 64000        # placeholder: verify
    qualityTier: A
    price:                        # placeholder: verify (USD per million tokens)
      inputPerMtok: "3.00"
      outputPerMtok: "15.00"
      currency: USD
      sourceRef: "TODO: provider pricing page"

  - id: local-chat
    providerId: local-llm
    providerModelName: local-model-name   # placeholder: the model name the server reports (GET /v1/models)
    lifecycle: ACTIVE
    # Declarations are the operator's claims. Verify each with the capability probe (design 05 section 12) against the real server before relying on it:
    # STRUCTURED_OUTPUT_NATIVE is sent as response_format json_schema; TOOL_CALLING as OpenAI-style tools / tool_choice.
    # A request needing a capability that is not declared here is never routed to this model.
    capabilities: [TEXT, STREAMING, SYSTEM_PROMPT, STRUCTURED_OUTPUT_NATIVE, TOOL_CALLING]
    contextWindowTokens: 8192     # placeholder: verify against the deployed server
    maxOutputTokens: 1024         # placeholder: verify
    qualityTier: C
    price:                        # example: free on-premises (explicit zero, no exchange rate needed). Confirm the cost model.
      inputPerMtok: "0"
      outputPerMtok: "0"
      currency: USD
      sourceRef: "example: on-premises, no per-token charge"
